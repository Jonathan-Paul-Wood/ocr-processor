name: ocr-processor
services:
  processor:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${OCR_PORT:-8090}:8090"
    environment:
      OCR_API_KEY: ${OCR_API_KEY:?Set a random OCR_API_KEY of at least 32 characters}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-180}
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 200s


name: ocr-processor
services:
  processor:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OCR_PORT:-8081}:8081"
    environment:
      OCR_API_KEY: ${OCR_API_KEY:?Set a random OCR_API_KEY of at least 32 characters}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SYSTEMONE_IP: ${SYSTEMONE_IP:-}
      SYSTEMONE_PORT: ${SYSTEMONE_PORT:-8009}
      SYSTEMONE_API_KEY: ${SYSTEMONE_API_KEY:-}
      SYSTEMONE_MODEL: ${SYSTEMONE_MODEL:-kev-latest}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-1800}
      SYSTEMONE_TIMEOUT_SECONDS: ${SYSTEMONE_TIMEOUT_SECONDS:-600}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-120}
      DEBUG_MODE: "${DEBUG_MODE:-FALSE}"
      DEBUG_LOG_DIR: /debug
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
      - /debug:rw,noexec,nosuid,size=64m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 1820s

